<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:800px;background:#F6F7F8;font-family:Inter,system-ui,sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:84px 92px 150px;position:relative;overflow:hidden}
  /* the field trace, as the page actually draws it, used as a ground */
  .trace{position:absolute;left:0;top:auto;bottom:0;width:1200px;height:188px;opacity:.42}
  .mark{width:108px;height:108px;display:block;margin-bottom:34px}
  h1{font-size:92px;font-weight:800;letter-spacing:-.035em;color:#15181C;line-height:1}
  .sub{font-size:31px;color:#596069;margin-top:20px;line-height:1.35;max-width:830px}
  .rule{width:92px;height:5px;background:#0A6E62;border-radius:3px;margin:40px 0 32px}
  .figs{display:flex;gap:64px}
  .fig b{display:block;font-size:66px;font-weight:800;color:#0A6E62;letter-spacing:-.03em;
         font-variant-numeric:tabular-nums;line-height:1}
  .fig span{display:block;font-size:21px;color:#6E767F;margin-top:9px}
  .foot{position:absolute;left:92px;bottom:54px;font-size:20px;color:#6E767F;letter-spacing:.02em}
</style>
